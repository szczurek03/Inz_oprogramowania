<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleProsby.css" class="css">
    <title>Prośby o dodanie treści</title>
</head>
<body>
     <div class="panel-container">
    <header>
      <h1>Panel zarządzania prośbami</h1>
      <div class="search-sort">
        <input type="text" placeholder="🔍 Wyszukaj tytuł">
        <select>
          <option>Sortuj według</option>
          <option>Data</option>
          <option>Ilość</option>
        </select>
      </div>
    </header>

    <div class="info-link">
      <button>Sprawdź pilne prośby (powyżej 100 zgłoszeń) !</button>
    </div>

    <section class="requests">
      <h2>Najnowsze:</h2>

      <div class="request-item">
        <div class="left-group">
        <span class="title">Lot nad kukułczym gniazdem</span>
        <button class="expand">Rozwiń</button>
        </div>
        <div class="status">Status: <b>Oczekujące (246 próśb)</b> !</div>
      </div>

      <div class="request-item">
        <div class="left-group">
        <span class="title">Full Metal Jacket</span>
        <button class="expand">Rozwiń</button>
        </div>
        <span class="status">Status: <b>Oczekujące (7 próśb)</b></span>
      </div>

      <div class="request-item">
        <div class="left-group">
        <span class="title">Szeregowiec Ryan</span>
        <button class="expand">Rozwiń</button>
        </div>
        <span class="status">Status: <b>Oczekujące (69 próśb)</b></span>
      </div>

      <div class="request-item">
        <div class="left-group">
        <span class="title">Minecraft</span>
        <button class="expand">Rozwiń</button>
        </div>
        <span class="status">Status: <b>Oczekujące (35 próśb)</b></span>
      </div>

      <div class="request-item">
        <div class="left-group">
        <span class="title">Lot nad kukułczym gniazdem</span>
        <button class="expand">Rozwiń</button>
        </div>
        <span class="status">Status: <b>Oczekujące (246 próśb)</b> !</span>
      </div>
    </section>
  </div>


</body>
</html>
